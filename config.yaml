# EMS Python Configuration
# Configuration for Energy Management System Python implementation

# Inverter Configuration
inverter:
  #type: "solark_split_phase"  # Options: "solark_split_phase", "solark_3phase"
  type: "solark_3phase"
  modbus_address: 1
  poll_interval: 1.0  # seconds
  max_retries: 3
  retry_delay: 1  # seconds

# Serial/RS485 Configuration
serial:
  # Primary RS485 port for Sol-Ark communication
  port: "/dev/tty.usbserial-A10OGBLS"  # Change to your actual RS485 device
  #port: "/dev/ttyRS485" #Default port for Compulab devices
  baudrate: 9600
  bytesize: 8
  parity: "N"  # None
  stopbits: 1
  timeout: 2.0
  

# SunSpec Modbus TCP Server Configuration
sunspec_server:
  enabled: true
  #host: "127.0.0.1"      # Listen on all interfaces
  host: "192.168.0.231"  # Local Testing IP
  #host: "192.168.1.10"    #Default Compulab Static IP
  port: 8502
  slave: 1

# Logging Configuration
logging:
  level: "INFO"  # DEBUG, INFO, WARNING, ERROR
  format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
  file: "ems.log"
  max_bytes: 10485760  # 10MB
  backup_count: 5

# Data Storage Configuration
data:
  # SQLite database for historical data
  database: "ems_data.db"
  # Data retention period in days
  retention_days: 30
  # Export data to CSV
  csv_export: true
  csv_directory: "data_exports"

# Device Information (for SunSpec Common Model)
device_info:
  manufacturer: "Ampra Grid Inc"
  #LV Config
  model: "LV-SA-GW" # Option for Low Voltage Modbus Map
  version: "130" # Release Version of Low Voltage Modbus Map

  #HV Config
  #model: "HV-SA-GW" # Option for High Voltage Modbus Map
  #version: "004" # Release Version of High Voltage Modbus Map
  serial_number: "JOULE-EMS-0001"
  options: "Sol-Ark Gateway"

# Monitoring and Alerts
monitoring:
  # Enable console output
  console_output: true
  # Update interval for console display
  console_update_interval: 10.0  # seconds
  
  # Alert thresholds
  alerts:
    battery_low_soc: 20  # %
    battery_high_temp: 50  # °C
    grid_voltage_low: 110  # V
    grid_voltage_high: 130  # V